<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishDrop</title>
    
    <link rel="icon" type="image/png" href="ChatGPT Image Jun 28, 2025, 06_12_44 PM (1).png">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --brand-blue: #9ac1e0;
            --brand-yellow: #fae845;
            --brand-dark: #2b2b2b;
            --brand-bg: #f7f7f7;
            --brand-white: #ffffff;
            --danger-red: #dc3545;
            --success-green: #28a745;
        }

        body { 
            font-family: Arial, sans-serif; 
            padding: 20px 10px; 
            background-color: var(--brand-bg); 
            color: var(--brand-dark); 
            font-size: 16px; 
        }
        
        .form-container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: var(--brand-white); 
            padding: 30px 20px; 
            border-left: 8px solid var(--brand-blue); 
            border-top: 8px solid var(--brand-yellow);
            border-right: 8px solid var(--brand-yellow);
            border-bottom: 8px solid var(--brand-yellow);
            border-radius: 8px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        h2 { 
            text-align: center; 
            color: var(--brand-dark); 
            margin: 0;
            font-size: 28px; 
        }
        
        .dish-block, .category-block, .restaurant-block { 
            background: #fdfdfd; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 20px 15px; 
            margin-bottom: 25px; 
            position: relative; 
        }

        .restaurant-block {
            border-color: var(--brand-blue);
            background-color: #f4f9fd;
        }
        
        .dish-title { 
            font-size: 20px; 
            font-weight: bold; color: var(--brand-dark); 
            margin-top: 0; margin-bottom: 15px; 
            border-bottom: 3px solid var(--brand-yellow); 
            display: inline-block; padding-bottom: 5px; 
        }

        label { display: block; margin-top: 15px; font-weight: bold; color: #444; font-size: 15px; } 
        input[type="text"], input[type="number"], textarea { 
            width: 100%; padding: 14px; margin-top: 6px; 
            border: 1px solid #ccc; background-color: #fafafa;
            box-sizing: border-box; font-family: inherit; font-size: 15px; 
            transition: 0.3s;
            border-radius: 5px;
        }
        input:focus, textarea:focus {
            border-color: var(--brand-blue);
            outline: none;
            background-color: var(--brand-white);
        }

        .file-input-hidden { display: none; }
        
        .custom-file-upload {
            display: block;
            padding: 16px 14px; 
            cursor: pointer;
            background-color: var(--brand-bg);
            border: 2px dashed var(--brand-blue);
            color: var(--brand-dark);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 15px; 
            transition: 0.3s;
            margin-top: 8px;
        }
        .custom-file-upload:hover {
            background-color: #eaf3fa;
            border-color: #79aed6;
        }
        .file-name-display {
            font-size: 14px; 
            color: #555;
            margin-top: 8px;
            display: block;
            font-weight: bold;
        }
        
        .image-preview {
            display: none; 
            max-width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #ddd;
            object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .checkbox-group {
            margin-top: 15px;
            background: #f0f4f8;
            padding: 15px;
            border-radius: 5px;
            min-height: 20px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            margin-top: 8px;
            font-weight: normal;
            cursor: pointer;
            padding: 5px 0;
            font-size: 15px;
        }
        .checkbox-label input {
            width: auto;
            margin-left: 10px;
            margin-top: 0;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .empty-dishes-msg {
            color: #666;
            font-size: 14px;
            font-style: italic;
            display: none;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { font-family: inherit; border-radius: 6px; }

        .add-btn { 
            width: 100%; padding: 16px; background-color: var(--brand-blue); 
            color: var(--brand-dark); border: none; font-size: 17px; font-weight: bold; 
            cursor: pointer; margin-bottom: 25px; transition: 0.2s; 
        }
        .add-btn:hover { background-color: #85aed0; }
        
        .add-cat-btn { background-color: var(--brand-yellow); }
        .add-cat-btn:hover { background-color: #ebd630; }

        .remove-btn { 
            background-color: var(--danger-red); color: white; border: none; padding: 6px 12px; 
            font-size: 13px; font-weight: bold; cursor: pointer; position: absolute; top: 20px; left: 15px; 
        }
        
        .next-btn, .submit-btn, .back-btn { 
            flex: 1; padding: 16px; border: none; font-size: 17px; font-weight: bold; 
            cursor: pointer; transition: 0.2s; 
        }
        
        .next-btn { background-color: var(--brand-yellow); color: var(--brand-dark); }
        .back-btn { background-color: #e0e0e0; color: var(--brand-dark); }
        .submit-btn { background-color: var(--success-green); color: white; }
        
        .submit-btn:disabled, .next-btn:disabled { background-color: #cccccc; color: #666; cursor: not-allowed; }
        .compress-status { font-size: 14px; font-weight: bold; margin-top: 8px; margin-bottom: 0; }
        
        #step2 { display: none; }
        .step-indicator { 
            text-align: center; color: var(--brand-dark); font-size: 16px; 
            margin-bottom: 25px; font-weight: bold; background: #eee; 
            padding: 12px; border-radius: 6px;
        }

        #fixing {
            text-align: center; 
            margin: auto;
        }

        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .form-container {
                padding: 20px 12px;
                border-width: 5px; 
            }
            .dish-block, .category-block, .restaurant-block {
                padding: 15px 10px; 
            }
            .btn-group { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="fixing">
     <h3>.يرجى كتابة الرابط بالطريقة الصحيحة</h3>   
     <h3>Please type the correct link.</h3>   
    </div>
</body>
</html>
