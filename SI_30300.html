<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DishDrop-kw / تسجيل الدخول</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Cairo", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #e2e8f0;
        margin: 0;
      }

      #auth-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #0ea5e9;
        border-top-color: #1e3a8a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .login-box {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        text-align: center;
        width: 100%;
        max-width: 360px;
        box-sizing: border-box;
        display: none;
      }

      .login-box h2 {
        margin-bottom: 25px;
        color: #1e293b;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
      }

      input:focus {
        border-color: #3b82f6;
      }

      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none !important;
      }

      .password-wrapper {
        position: relative;
        width: 100%;
      }

      .password-wrapper input {
        padding-left: 45px;
      }

      .toggle-password {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        display: flex;
        align-items: center;
        color: #64748b;
        transition: 0.2s;
        z-index: 10;
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        margin-top: 15px;
        transition: 0.3s;
      }

      .btn-primary:hover {
        background-color: #2563eb;
      }

      .divider {
        margin: 20px 0;
        color: #64748b;
        font-size: 14px;
        position: relative;
      }

      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background-color: #cbd5e1;
      }

      .divider::before {
        right: 0;
      }
      .divider::after {
        left: 0;
      }

      .btn-google {
        width: 100%;
        padding: 12px;
        background-color: white;
        color: #333;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.3s;
      }

      .btn-google:hover {
        background-color: #f8fafc;
      }

      .error-msg {
        color: #ef4444;
        margin-top: 15px;
        display: none;
        font-size: 14px;
        font-weight: 600;
        background-color: #fef2f2;
        padding: 10px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="auth-loader">
      <div class="spinner"></div>
    </div>

    <div class="login-box" id="login-box">
      <h2>دخول المطاعم</h2>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required />
      <div class="password-wrapper">
        <input
          type="password"
          id="password"
          placeholder="الرقم السري"
          required
        />
        <span class="toggle-password" id="togglePassword">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>
      </div>
      <button id="login-btn" class="btn-primary">دخول</button>
      <div id="error-msg" class="error-msg">البيانات غير صحيحة!</div>
      <div class="divider">أو</div>
      <button id="google-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path
            fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"
          ></path>
          <path
            fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
          ></path>
          <path
            fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
          ></path>
          <path
            fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
          ></path>
          <path fill="none" d="M0 0h48v48H0z"></path>
        </svg>
        الدخول بواسطة حساب Google
      </button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAmMB6t0ePeB4Sx4sjjK_djhMj-WKbLnwM",
        authDomain: "dishdrop-kw.firebaseapp.com",
        projectId: "dishdrop-kw",
        storageBucket: "dishdrop-kw.firebasestorage.app",
        messagingSenderId: "844568139665",
        appId: "1:844568139665:web:6444cdcfbe9709ea166c30",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      const errorMsg = document.getElementById("error-msg");
      const loginBtn = document.getElementById("login-btn");
      const authLoader = document.getElementById("auth-loader");
      const loginBox = document.getElementById("login-box");

      document
        .getElementById("togglePassword")
        .addEventListener("click", () => {
          const p = document.getElementById("password");
          p.type = p.type === "password" ? "text" : "password";
        });

      function routeUser(email) {
        if (email === "yousef2008alqattan@gmail.com") {
          window.location.href = "MMHpanel.html";
        } else {
          auth.signOut();
          authLoader.style.display = "none";
          loginBox.style.display = "block";
          errorMsg.innerText = "عذراً، هذا الحساب غير مصرح له بالدخول!";
          errorMsg.style.display = "block";
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          routeUser(user.email);
        } else {
          authLoader.style.display = "none";
          loginBox.style.display = "block";
        }
      });

      loginBtn.addEventListener("click", () => {
        const e = document.getElementById("email").value;
        const p = document.getElementById("password").value;

        loginBtn.innerText = "جاري الدخول...";
        errorMsg.style.display = "none";

        signInWithEmailAndPassword(auth, e, p).catch(() => {
          loginBtn.innerText = "دخول";
          errorMsg.innerText = "البيانات غير صحيحة!";
          errorMsg.style.display = "block";
        });
      });

      document.getElementById("google-btn").addEventListener("click", () => {
        signInWithPopup(auth, provider).catch(() => {
          errorMsg.innerText = "حدث خطأ في التسجيل!";
          errorMsg.style.display = "block";
        });
      });
    </script>
  </body>
</html>
